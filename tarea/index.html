<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro de notas</title>
    <style>
      :root {
        --fondo: #f6f7f4;
        --tarjeta: #ffffff;
        --texto: #1f2a24;
        --suave: #5d6b63;
        --borde: #d5dbd6;
        --acento: #1f6f4a;
        --error: #b3261e;
        --ok: #1f6f4a;
        --aprobado: #e3f2e8;
        --desaprobado: #fbe7e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #151a17;
          --tarjeta: #1e2521;
          --texto: #e8eee9;
          --suave: #9aa8a0;
          --borde: #34403a;
          --acento: #5fc08f;
          --error: #ff8a80;
          --ok: #5fc08f;
          --aprobado: #1f3a2b;
          --desaprobado: #40231f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--fondo);
        color: var(--texto);
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.5;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      h1 {
        font-size: 1.9rem;
        margin: 0 0 0.25rem;
      }
      .sub {
        color: var(--suave);
        margin: 0 0 1.5rem;
      }
      form,
      .bloque {
        background: var(--tarjeta);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .fila {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .campo {
        flex: 1 1 160px;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      label {
        font-size: 0.9rem;
        color: var(--suave);
      }
      input {
        font: inherit;
        padding: 0.5rem 0.6rem;
        border: 1px solid var(--borde);
        border-radius: 6px;
        background: var(--fondo);
        color: var(--texto);
        width: 100%;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--acento);
        outline-offset: 2px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 6px;
        padding: 0.5rem 0.9rem;
        border: 1px solid var(--acento);
        background: var(--acento);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        button {
          color: #0f1813;
        }
      }
      button.borrar {
        background: transparent;
        color: var(--error);
        border-color: var(--error);
        padding: 0.25rem 0.6rem;
        font-size: 0.9rem;
      }
      #formulario button[type="submit"] {
        margin-top: 0.75rem;
      }
      #mensaje {
        min-height: 1.5rem;
        margin: 0.75rem 0 0;
        font-size: 0.95rem;
      }
      #mensaje.error {
        color: var(--error);
      }
      #mensaje.ok {
        color: var(--ok);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0.75rem 0 0;
        display: grid;
        gap: 0.5rem;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 0.75rem;
        border-radius: 6px;
        border: 1px solid var(--borde);
      }
      li.aprobado {
        background: var(--aprobado);
      }
      li.desaprobado {
        background: var(--desaprobado);
      }
      li.vacio {
        justify-content: center;
        color: var(--suave);
        border-style: dashed;
        background: transparent;
      }
      #promedio {
        font-size: 1.15rem;
        font-weight: bold;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Registro de notas</h1>
      <p class="sub">Escala vigesimal: de 0 a 20. Se aprueba con 11 o más.</p>

      <form id="formulario" novalidate>
        <div class="fila">
          <div class="campo">
            <label for="nombre">Estudiante</label>
            <input
              id="nombre"
              type="text"
              autocomplete="off"
              placeholder="Ej.: Ana Torres"
            />
          </div>
          <div class="campo">
            <label for="nota">Nota</label>
            <input id="nota" type="number" step="0.5" placeholder="0 a 20" />
          </div>
        </div>
        <button type="submit">Agregar nota</button>
        <p id="mensaje" role="alert"></p>
      </form>

      <div class="bloque">
        <label for="buscador">Buscar estudiante</label>
        <input
          id="buscador"
          type="search"
          autocomplete="off"
          placeholder="Escribe un nombre"
        />
        <ul id="lista"></ul>
      </div>

      <div class="bloque">
        <p id="promedio"></p>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
